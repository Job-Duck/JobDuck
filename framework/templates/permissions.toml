# Job Duck permissions. The setup skill fills this in; edit by hand any time.
# Nothing runs until its module is switched on. CAPTCHAs and SMS codes always stop for you; emailed codes do too unless email_codes = "auto_from_mail".

[modules]
cv = false
find = false
track = false
apply = false
interview = false

[apply]
autonomy = "confirm_each"           # confirm_each | confirm_batch | auto_after_approvals
approvals_before_auto = 10          # approved submissions before auto_after_approvals takes over
eeo = "decline"                     # decline | from_profile (from_profile answers with [apply.self_id])
ats_accounts = "never"              # never | reuse | create
email_codes = "ask"                 # ask | auto_from_mail
salary_mode = "leave_blank"         # posting_range_upper | fixed | leave_blank
salary_floor = 0
salary_fixed_total = 0
salary_fixed_base = 0
uploads = ["cv"]                    # cv, cover_letter, portfolio, transcript
cover_letter = "only_when_required" # only_when_required | never | always
tailor_cv = "never"                 # never | when_bottleneck | always
free_text = "draft_for_approval"    # never | draft_for_approval | auto_from_profile
skip_companies = []
max_per_run = 10
marker = true                       # paste the JobDuck-Application-Id marker into an editable field

[apply.consents]
privacy_policy = false
terms = false
arbitration = false
background_check = false
e_signature = false
marketing_opt_in = false

[apply.self_id]
# Voluntary self-identification. "decline" picks the form's prefer-not-to-say option.
gender = "decline"                  # decline | female | male | non_binary
veteran_status = "decline"          # decline | not_veteran | veteran
disability_status = "decline"       # decline | no | yes

[apply.answers]

[track]
sync_url = ""
sync_token = ""
auto_apply_interview_signals = false # record synced interview, assessment and offer emails without asking to confirm
auto_sync_minutes = 15              # while jobduck dashboard runs, sync every N minutes (0 to 1440); 0 turns it off

[cv]
page_limit = 2

[schedule]
# jobduck schedule install adds a daily job to your OS scheduler that runs your agent unattended.
enabled = false                     # set by jobduck schedule install / remove; false pauses scheduled runs
time = "08:00"                      # HH:MM, local time
mode = "find_only"                  # find_only | apply
# host = "claude"                   # claude | codex | gemini; unset: the first host registered for the workspace, else claude
